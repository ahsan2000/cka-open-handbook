# Install Gateway API CRDs and a supported controller first.
# Replace REPLACE_WITH_INSTALLED_CLASS before applying.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gateway
  namespace: cka-lab
spec:
  gatewayClassName: REPLACE_WITH_INSTALLED_CLASS
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route
  namespace: cka-lab
spec:
  parentRefs:
  - name: web-gateway
    sectionName: http
  hostnames: [web.example.test]
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: web
      port: 8080
