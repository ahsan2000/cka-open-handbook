apiVersion: v1
kind: Namespace
metadata:
  name: cka-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: cka-lab
data:
  MODE: study
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: cka-lab
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        ports:
        - name: http
          containerPort: 80
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /
            port: http
          failureThreshold: 30
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: cka-lab
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 8080
    targetPort: http
